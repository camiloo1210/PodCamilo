apiVersion: v1
kind: Namespace
metadata:
  name: podcamilo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podcamilo-page
  namespace: podcamilo
data:
  index.html: |
    <!doctype html>
    <html lang="es"><head><meta charset="utf-8"><title>Pod Camilo</title>
    <style>body{font-family:system-ui;margin:0;display:grid;min-height:100vh;place-items:center;background:#0f172a;color:#e2e8f0}main{padding:3rem;border:1px solid #38bdf8;border-radius:1rem;background:#172554}code{color:#7dd3fc}</style>
    </head><body><main><h1>Pod Camilo</h1><p>Este sitio corre dentro de <code>k3d/K3s</code>.</p><p>Deployment → Pod → Service</p></main></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcamilo-web
  namespace: podcamilo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcamilo-web
  template:
    metadata:
      labels:
        app: podcamilo-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: page
          configMap:
            name: podcamilo-page
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: podcamilo-web
  namespace: podcamilo
spec:
  selector:
    app: podcamilo-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
